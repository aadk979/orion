<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Orion — OAuth Callback</title>
        <link rel="stylesheet" href="../../../styles.css" />
    </head>
    <body>
        <div class="page-center">
            <div class="card" style="width: 100%; max-width: 420px; text-align: center;">
                <div class="logo" style="margin-bottom: 1rem;">ORION</div>
                <h2 id="status-title">Authenticating...</h2>
                <p id="status-message">Please wait while we complete your sign-in.</p>
                <div class="spinner" id="loading-spinner" style="border-top-color: var(--primary); width: 2rem; height: 2rem; margin: 1.5rem auto; display: block;"></div>
                <div id="alert" class="alert"></div>
                <p style="margin-top: 1.5rem;">
                    <a href="../../../auth.html" class="link" style="font-size: 0.85rem; display: none;" id="back-link">← Back to Sign In</a>
                </p>
            </div>
        </div>

        <script type="module">
            import { orion } from '../../../orion.js';

            const statusTitle = document.getElementById('status-title');
            const statusMessage = document.getElementById('status-message');
            const alertEl = document.getElementById('alert');
            const spinner = document.getElementById('loading-spinner');
            const backLink = document.getElementById('back-link');

            function showAlert(msg, type = 'error') {
                alertEl.textContent = msg;
                alertEl.className = `alert alert-${type} show`;
            }

            async function processCallback() {
                try {
                    await orion.initialize();
                    const result = await orion.handleOAuthCallback();

                    spinner.style.display = 'none';

                    if (result.error) {
                        statusTitle.textContent = 'Authentication Failed';
                        statusMessage.textContent = 'We could not sign you in with Orion.';
                        showAlert(result.errorCode || 'An unknown error occurred.');
                        backLink.style.display = 'inline-block';
                    } else if (result.signedIn) {
                        statusTitle.textContent = 'Success!';
                        statusMessage.textContent = 'You have successfully signed in. Redirecting...';
                        
                        // Give it a brief moment before redirecting to dashboard
                        setTimeout(() => {
                            window.location.href = '../../../dashboard.html';
                        }, 1500);
                    } else {
                        statusTitle.textContent = 'Action Required';
                        statusMessage.textContent = 'Further action might be needed to complete sign-in.';
                        backLink.style.display = 'inline-block';
                    }
                } catch (err) {
                    spinner.style.display = 'none';
                    statusTitle.textContent = 'Error';
                    statusMessage.textContent = 'An unexpected error occurred during authentication.';
                    showAlert(err.message || 'Unknown error');
                    backLink.style.display = 'inline-block';
                }
            }

            // Start the callback processing
            processCallback();
        </script>
    </body>
</html>
